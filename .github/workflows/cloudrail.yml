name: Cloudrail

on:
  push:
    branches: ["main"]
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - ".github/workflows/cloudrail.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - ".github/workflows/cloudrail.yml"
  workflow_dispatch:
  schedule:
    - cron: "15 22 * * 5"

permissions:
  contents: read

jobs:
  cloudrail:
    name: Run Indeni Cloudrail on Terraform code with SARIF output
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for Terraform configuration
        id: terraform
        shell: bash
        run: |
          if find . -type f \( -name '*.tf' -o -name '*.tfvars' \) -not -path './.git/*' -print -quit | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No Terraform files found; Cloudrail scan is not applicable."
          fi

      - name: Validate required credentials
        if: steps.terraform.outputs.found == 'true'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CLOUDRAIL_API_KEY: ${{ secrets.CLOUDRAIL_API_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$AWS_ACCESS_KEY_ID" ]] || missing+=("AWS_ACCESS_KEY_ID")
          [[ -n "$AWS_SECRET_ACCESS_KEY" ]] || missing+=("AWS_SECRET_ACCESS_KEY")
          [[ -n "$CLOUDRAIL_API_KEY" ]] || missing+=("CLOUDRAIL_API_KEY")
          if (( ${#missing[@]} )); then
            printf 'Missing required repository secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Set up Terraform
        if: steps.terraform.outputs.found == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Initialize Terraform
        if: steps.terraform.outputs.found == 'true'
        run: terraform init -input=false

      - name: Create Terraform plan
        if: steps.terraform.outputs.found == 'true'
        run: terraform plan -input=false -no-color -out=plan.out
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Run Cloudrail
        if: steps.terraform.outputs.found == 'true'
        uses: indeni/cloudrail-run-ga@b56ed2d30913c975b36df231adc2eabf05523622
        with:
          tf-plan-file: plan.out
          cloudrail-api-key: ${{ secrets.CLOUDRAIL_API_KEY }}
          cloud-account-id: ""

      - name: Upload Cloudrail SARIF
        if: always() && steps.terraform.outputs.found == 'true' && hashFiles('cloudrail_results.sarif') != ''
        uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b
        with:
          sarif_file: cloudrail_results.sarif
