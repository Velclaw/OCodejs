name: Install skills.sh pack

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/install-skills-sh-pack
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install all skills from the pack
        run: npx --yes skills add https://skills.sh/p/c7cuCCCdiiFNVj2S --all --yes --copy

      - name: Review generated files and commit to this branch only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes produced by the skills CLI."
            exit 0
          fi
          git commit -m "chore: install skills.sh pack"
          git push origin HEAD:chore/install-skills-sh-pack
