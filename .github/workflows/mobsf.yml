# MobSF static analysis workflow
name: MobSF
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '16 22 * * 4'
permissions:
  contents: read
jobs:
  mobile-security:
    # This repository is a JS/TS utility library, not a mobile application.
    # Run MobSF only when mobile package artifacts or manifests are present.
    if: ${{ hashFiles('**/*.apk', '**/*.aab', '**/AndroidManifest.xml', '**/*.ipa') != '' }}
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Run mobsfscan
        uses: MobSF/mobsfscan@a60d10a83af68e23e0b30611c6515da604f06f65
        with:
          args: . --sarif --output results.sarif
      - name: Upload mobsfscan report
        if: ${{ hashFiles('results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3
        with:
          sarif_file: results.sarif
