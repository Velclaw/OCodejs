name: Cloud Agent CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/cloud-agent/**"
      - ".github/workflows/cloud-agent-ci.yml"
  push:
    branches: [fix/cloud-agent-ci-pinned-actions]
    paths:
      - "apps/cloud-agent/**"
      - ".github/workflows/cloud-agent-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cloud-agent
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
