name: Validate AWS IAM policies in Terraform templates
on:
  push:
    branches: ["main"]
    paths:
      - "**/*.tf"
      - "**/*.tf.json"
  pull_request:
    branches: ["main"]
    paths:
      - "**/*.tf"
      - "**/*.tf.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-validator:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    name: Validate AWS IAM policies
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate required AWS configuration
        env:
          AWS_ROLE: ${{ secrets.AWS_ROLE }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TEMPLATE_PATH: ${{ vars.TEMPLATE_PATH }}
        run: |
          test -n "$AWS_ROLE" || { echo "::error::Set AWS_ROLE as an Actions secret containing the GitHub OIDC role ARN."; exit 1; }
          test -n "$AWS_REGION" || { echo "::error::Set AWS_REGION as a repository variable."; exit 1; }
          test -n "$TEMPLATE_PATH" || { echo "::error::Set TEMPLATE_PATH as a repository variable."; exit 1; }
          test -f "$TEMPLATE_PATH" || { echo "::error::TEMPLATE_PATH does not exist in this checkout."; exit 1; }
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Run AWS AccessAnalyzer ValidatePolicy check
        uses: aws-actions/terraform-aws-iam-policy-validator@1cd3c484b95b6c3d9e42ca1797d89ae74eb29ede # v1.0.3
        with:
          policy-check-type: VALIDATE_POLICY
          template-path: ${{ vars.TEMPLATE_PATH }}
          region: ${{ vars.AWS_REGION }}
