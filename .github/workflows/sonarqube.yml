# Optional SonarQube analysis. Run manually after configuring repository secrets/variables.
name: SonarQube analysis
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  Analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate SonarQube configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          test -n "$SONAR_TOKEN" || { echo "::error::Configure SONAR_TOKEN in repository Actions secrets."; exit 1; }
          test -n "$SONAR_HOST_URL" || { echo "::error::Configure SONAR_HOST_URL in repository Actions secrets."; exit 1; }
          test -n "$SONAR_PROJECT_KEY" || { echo "::error::Configure SONAR_PROJECT_KEY in repository Actions variables."; exit 1; }
      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@7295e71c9583053f5bf40e9d4068a0c974603ec8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
