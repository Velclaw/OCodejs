name: Multi-language CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: hashFiles('package.json') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - if: hashFiles('package.json') != ''
        run: |
          npm ci || npm install
          npm run build --if-present
          npm test --if-present

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: hashFiles('requirements.txt', 'pyproject.toml') != ''
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - if: hashFiles('requirements.txt', 'pyproject.toml') != ''
        run: |
          pip install -r requirements.txt || pip install .
          pip install pytest
          pytest || true

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: hashFiles('pom.xml', 'build.gradle', 'build.gradle.kts') != ''
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - if: hashFiles('pom.xml') != ''
        run: mvn -B verify
      - if: hashFiles('build.gradle', 'build.gradle.kts') != ''
        run: ./gradlew build

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: hashFiles('go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - if: hashFiles('go.mod') != ''
        run: |
          go build ./...
          go test ./...

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      - if: hashFiles('Cargo.toml') != ''
        run: |
          cargo build --verbose
          cargo test --verbose

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: hashFiles('**/*.csproj', '**/*.sln') != ''
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - if: hashFiles('**/*.csproj', '**/*.sln') != ''
        run: |
          dotnet restore
          dotnet build --no-restore
          dotnet test --no-build

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: hashFiles('composer.json') != ''
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"
      - if: hashFiles('composer.json') != ''
        run: composer install --no-interaction

  ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: hashFiles('Gemfile') != ''
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - if: hashFiles('Gemfile') != ''
        run: bundle exec rake || true

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: hashFiles('CMakeLists.txt') != ''
        run: |
          cmake -B build
          cmake --build build
          ctest --test-dir build || true
