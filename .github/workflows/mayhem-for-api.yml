# Mayhem API fuzzing. Configure MAYHEM_TOKEN and the API startup/spec before use.
name: "Mayhem for API"
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  mayhem-for-api:
    name: Mayhem for API
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start your API
        if: ${{ hashFiles('run_your_api.sh') != '' }}
        run: ./run_your_api.sh &
      - name: Mayhem for API
        if: ${{ secrets.MAYHEM_TOKEN != '' && hashFiles('run_your_api.sh') != '' }}
        uses: ForAllSecure/mapi-action@3af82733c74bd6d030bb264abe1face314e645a3 # v2.0.0
        continue-on-error: true
        with:
          mayhem-token: ${{ secrets.MAYHEM_TOKEN }}
          api-url: http://localhost:8080
          api-spec: http://localhost:8080/openapi.json
          duration: 60
          sarif-report: mapi.sarif
      - name: Upload SARIF file
        if: ${{ hashFiles('mapi.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3
        with:
          sarif_file: mapi.sarif
